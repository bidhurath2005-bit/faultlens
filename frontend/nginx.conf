map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Cache-Control is chosen here instead of with add_header inside each location block:
# any add_header in a location stops it inheriting the server-level add_header directives,
# which previously stripped every security header from HTML and /assets/ responses.
# An empty value means nginx adds no header (the API sets its own Cache-Control).
# /assets/ files have content-hashed names, so they can be cached for a year. Do not add
# `expires` there: it emits its own Cache-Control header, and the response would then carry two.
map $uri $faultlens_cache_control {
  ~^/api/     "";
  ~^/assets/  "public, max-age=31536000, immutable";
  default     "no-store";
}

server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # React Flow and Recharts set inline style attributes, hence 'unsafe-inline' for styles only. No inline scripts.
  # font-src allows data: because Vite inlines small @fontsource subsets into the CSS as data: URIs.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header Cache-Control $faultlens_cache_control;

  # Do not use add_header inside the location blocks below; see the comment above the map.

  location /api/v1/ws/ {
    proxy_pass http://faultlens-api:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_read_timeout 3600s;
  }

  location /api/ {
    proxy_pass http://faultlens-api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 1m;
  }

  location /assets/ {
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
