name: Backend & services

on:
  push:
    branches: [main]
    paths: ["backend/**", "services/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "services/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: faultlens
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: faultlens_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U faultlens" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.1-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Ephemeral CI-only values; no repository secrets are needed or used.
      DATABASE_URL: postgresql+asyncpg://faultlens:ci-only-password@localhost:5432/faultlens_test
      REDIS_URL: redis://localhost:6379/15
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-0123456789
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Migrations apply and match models
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Tests with coverage
        run: pytest -q --cov=app --cov-report=term --cov-report=xml --cov-fail-under=70
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt --progress-spinner off
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  services:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/requirements.txt
      - run: pip install -r requirements.txt ./common pytest==8.3.4 pytest-asyncio==0.24.0 ruff==0.8.4
      - run: ruff check .
      - run: pytest -q
        env:
          OTEL_ENABLED: "false"
      - run: pip install pip-audit==2.7.3 && pip-audit -r requirements.txt --progress-spinner off
