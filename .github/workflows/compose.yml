name: Docker images & Compose

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: compose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Generate throwaway .env for validation
        run: sh scripts/setup.sh
      - name: Validate compose configuration
        run: docker compose config --quiet
      - name: Build all images
        run: docker compose build
      - name: Smoke test - start the stack and wait for health
        run: |
          docker compose up -d
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/api/v1/health/live && break
            sleep 5
          done
          curl -sf http://localhost:8000/api/v1/health
          curl -sf -o /dev/null http://localhost:3080/
      - name: Integration tests against the running stack
        run: |
          python3 -m pip install -q httpx==0.28.1 websockets==14.1 pytest==8.3.4
          sleep 60   # let traffic produce telemetry and the probe/servicegraph metrics
          cd e2e && python3 -m pytest test_integration.py -v
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v
