# FaultLens local environment. All host ports bind to 127.0.0.1 only.
name: faultlens

x-service-env: &service-env
  ENVIRONMENT: ${ENVIRONMENT:-local}
  DATABASE_URL: postgresql+asyncpg://shop:${SHOP_DB_PASSWORD:?set SHOP_DB_PASSWORD in .env}@postgres:5432/shop
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  USER_SERVICE_URL: http://user-service:8000
  INVENTORY_SERVICE_URL: http://inventory-service:8000
  PAYMENT_SERVICE_URL: http://payment-service:8000
  NOTIFICATION_SERVICE_URL: http://notification-service:8000
  FAULT_INJECTION_ENABLED: ${FAULT_INJECTION_ENABLED:-true}
  FAULT_ADMIN_TOKEN: ${FAULT_ADMIN_TOKEN:?set FAULT_ADMIN_TOKEN in .env}
  DB_POOL_SIZE: "5"
  DB_POOL_TIMEOUT_S: "2"
  DOWNSTREAM_TIMEOUT_S: "3"

x-service: &service
  build: ./services
  image: faultlens/demo-service:1.0.0
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  mem_limit: 512m
  cpus: 1.0
  networks: [faultlens]
  depends_on:
    postgres: {condition: service_healthy}
    otel-collector: {condition: service_started}

services:
  # ---------------------------------------------------------------- demo microservices
  order-service:
    <<: *service
    environment: {<<: *service-env, SERVICE_NAME: order-service, SERVICE_MODULE: order_service.main:app}
    ports: ["127.0.0.1:8100:8000"]
  user-service:
    <<: *service
    environment: {<<: *service-env, SERVICE_NAME: user-service, SERVICE_MODULE: user_service.main:app}
  payment-service:
    <<: *service
    environment: {<<: *service-env, SERVICE_NAME: payment-service, SERVICE_MODULE: payment_service.main:app}
  inventory-service:
    <<: *service
    environment: {<<: *service-env, SERVICE_NAME: inventory-service, SERVICE_MODULE: inventory_service.main:app}
  notification-service:
    <<: *service
    environment: {<<: *service-env, SERVICE_NAME: notification-service, SERVICE_MODULE: notification_service.main:app}
  traffic-generator:
    <<: *service
    environment:
      SERVICE_MODULE: traffic_generator.main:app
      ORDER_SERVICE_URL: http://order-service:8000
      USER_SERVICE_URL: http://user-service:8000
      INVENTORY_SERVICE_URL: http://inventory-service:8000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      FAULT_ADMIN_TOKEN: ${FAULT_ADMIN_TOKEN}
      TRAFFIC_RPS: ${TRAFFIC_RPS:-8}
      TRAFFIC_SEED: ${TRAFFIC_SEED:-1234}
      TRAFFIC_AUTOSTART: ${TRAFFIC_AUTOSTART:-true}
    mem_limit: 256m
    depends_on:
      order-service: {condition: service_healthy}
      user-service: {condition: service_healthy}
      inventory-service: {condition: service_healthy}
      payment-service: {condition: service_healthy}
      notification-service: {condition: service_healthy}

  # ---------------------------------------------------------------- FaultLens platform
  faultlens-api:
    build: ./backend
    image: faultlens/backend:1.0.0
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000 --workers 2 --timeout-keep-alive 30 --no-access-log --proxy-headers --forwarded-allow-ips=*"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    env_file: [.env]
    environment: &platform-env
      DATABASE_URL: postgresql+asyncpg://faultlens:${FAULTLENS_DB_PASSWORD:?set FAULTLENS_DB_PASSWORD}@postgres:5432/faultlens
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      TEMPO_URL: http://tempo:3200
      TRAFFIC_GENERATOR_URL: http://traffic-generator:8000
      SERVICE_URLS: '{"order-service":"http://order-service:8000","user-service":"http://user-service:8000","payment-service":"http://payment-service:8000","inventory-service":"http://inventory-service:8000","notification-service":"http://notification-service:8000"}'
      CORS_ORIGINS: '["http://localhost:3080","http://127.0.0.1:3080","http://localhost:5173"]'
      ENVIRONMENT: ${ENVIRONMENT:-local}
    ports: ["127.0.0.1:8000:8000"]
    networks: [faultlens]
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}

  faultlens-worker:
    image: faultlens/backend:1.0.0
    command: ["python", "-m", "app.workers.main"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    env_file: [.env]
    environment: *platform-env
    networks: [faultlens]
    mem_limit: 1g
    depends_on:
      faultlens-api: {condition: service_healthy}

  frontend:
    build: ./frontend
    image: faultlens/frontend:1.0.0
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:3080:8080"]
    networks: [faultlens]
    depends_on:
      faultlens-api: {condition: service_healthy}

  # ---------------------------------------------------------------- data stores
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      FAULTLENS_DB_PASSWORD: ${FAULTLENS_DB_PASSWORD}
      SHOP_DB_PASSWORD: ${SHOP_DB_PASSWORD}
    command: ["postgres", "-c", "max_connections=200"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    ports: ["127.0.0.1:5432:5432"]
    networks: [faultlens]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["127.0.0.1:6379:6379"]
    networks: [faultlens]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  kafka:
    image: apache/kafka:3.8.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    ports: ["127.0.0.1:9094:9094"]
    volumes: [kafkadata:/var/lib/kafka/data]
    networks: [faultlens]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 15s

  # ---------------------------------------------------------------- observability
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: [./deploy/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro]
    networks: [faultlens]
    depends_on: [tempo, loki]

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=3d", "--web.enable-lifecycle"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    networks: [faultlens]

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./deploy/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - lokidata:/loki
    ports: ["127.0.0.1:3100:3100"]
    networks: [faultlens]

  tempo:
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    user: "0"
    volumes:
      - ./deploy/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempodata:/var/tempo
    ports: ["127.0.0.1:3200:3200"]
    networks: [faultlens]

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_FEATURE_TOGGLES_ENABLE: traceToLogs
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    networks: [faultlens]
    depends_on: [prometheus, loki, tempo]

networks:
  faultlens:
    driver: bridge

volumes:
  pgdata:
  kafkadata:
  promdata:
  lokidata:
  tempodata:
  grafanadata:
