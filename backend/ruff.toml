line-length = 160
target-version = "py312"
[lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "S311", "B008", "S105", "S106", "E731", "B904", "UP007"]
[lint.per-file-ignores]
"tests/*" = ["S", "B"]
"migrations/*" = ["E501"]
# Signal tables and PromQL strings are intentionally kept one-per-line for readability.
"app/engines/rca/hypotheses.py" = ["E501"]
"app/api/v1/observability.py" = ["E501"]
